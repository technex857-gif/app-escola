<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarita - Splash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="tela">
        
        <!-- Bloco da Ilustração construído  em CSS -->
        <div class="splash-fundo">
            <h2 class="titulo" style="font-size: 20px;">Respostas que ensinam.</h2>
            
            <div class="splash-grade">
                <!-- Linha 1 -->
                <div class="bolinha azul-forte"></div> <div class="bolinha"></div> <div class="bolinha"></div> <div class="bolinha"></div>
                <!-- Linha 2 -->
                <div class="bolinha"></div> <div class="bolinha azul-forte"></div> <div class="bolinha"></div> <div class="bolinha"></div>
                <!-- Linha 3 -->
                <div class="bolinha"></div> <div class="bolinha"></div> <div class="bolinha azul-forte"></div> <div class="bolinha"></div>
                <!-- Linha 4 -->
                <div class="bolinha"></div> <div class="bolinha"></div> <div class="bolinha"></div> <div class="bolinha azul-forte"></div>
            </div>

            <!-- Botão Verde Flutuante -->
            <a href="login.html" class="btn-check-verde">✓</a>
        </div>

        <h1 class="titulo">Menos correção.<br>Mais tempo para ensinar.</h1>
        <p class="descricao">Escaneie respostas e acompanhe cada aluno, com clareza e confiança.</p>
        
        <div class="links-rodape">
            <p style="font-size: 14px; font-weight: bold; color: #1a1a1a;">Verificando sua sessão...</p>
            <p style="font-size: 14px; color: #777;">Seu espaço de ensino, pronto para você.</p>
        </div>

    </section>
</body>
</html>
