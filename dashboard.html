<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarita - Início</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="tela" style="background-color: #f4f6fb; padding: 20px 15px;">
        <header class="header-dash">
            <h2 class="logo-texto">Gabarita</h2>
            <h1 class="titulo" style="font-size: 24px;">Bom dia, Marina</h1>
            <p class="descricao">Vamos simplificar as correções de hoje?</p>
        </header>

        <div class="cards-resumo">
            <div class="card">
                <h3>2</h3><p>Turmas</p>
            </div>
            <div class="card">
                <h3>12</h3><p>Alunos</p>
            </div>
            <div class="card destaque">
                <h3>+</h3><p>Avaliação</p>
            </div>
        </div>

        <div style="background: white; padding: 20px; border-radius: 16px;">
            <p style="font-size: 12px; font-weight: bold; color: orange; margin-bottom: 10px;">Pendente</p>
            <h4 style="font-size: 18px; margin-bottom: 5px;">Frações - 7º ano A</h4>
            <p style="font-size: 14px; color: #777; margin-bottom: 15px;">0 de 6 alunos corrigidos</p>
            <!-- Simula o início da correção -->
            <a href="#" class="btn-primario">Iniciar correção</a>
        </div>
        
        <!-- Botão para simular o Logout -->
        <p style="text-align: center; margin-top: 30px;"><a href="login.html" style="color: red;">Sair do sistema</a></p>
    </section>
</body>
</html>
