<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarita - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="tela">
        <h2 class="logo-texto">Gabarita</h2>
        <h1 class="titulo">Olá, professor.<br>Que bom ter você aqui.</h1>
        <p class="descricao">Entre para cuidar das suas turmas e transformar respostas em aprendizado.</p>
        
        <form class="formulario">
            <div class="grupo-input">
                <label>E-mail</label>
                <input type="email" placeholder="marina.costa@escola.edu.br">
            </div>
            <div class="grupo-input">
                <label>Senha</label>
                <input type="password" placeholder="••••••••">
            </div>
            <div class="grupo-checkbox">
                <input type="checkbox" id="manter">
                <label for="manter">Manter conectado</label>
            </div>
            
            <!-- Link que funciona como Botão -->
            <a href="dashboard.html" class="btn-primario">Entrar</a>
        </form>

        <div class="links-rodape">
            <p>Primeira vez por aqui? <a href="cadastro.html">Criar conta</a></p>
            <p><a href="recuperar.html">Esqueci a senha</a></p>
        </div>
    </section>
</body>
</html>
